# AgentBot 示例配置。复制为 config.yaml 后按需修改。
# 校验：go run ./cmd/server --config config.example.yaml --check-config
transport:
  mode: wsclient
  url: ws://127.0.0.1:3001
  # 入站模式（wsserver / http）必须配置 access_token，否则启动失败（F-80）
  self_id: 0

llm:
  # provider: echo / openai / deepseek
  #   echo     —— 联调用假模型，回复固定模板，不访问网络
  #   deepseek —— DeepSeek 官方端点，支持思考模式与前缀缓存计量
  provider: deepseek
  model: deepseek-flash
  base_url: https://api.deepseek.com
  # 支持 ${VAR} 引用环境变量：未设置时启动即失败，而不是静默变成空串。
  api_key: ${DEEPSEEK_API_KEY}
  timeout: 60s
  # 注意：本字段当前**未生效**（会被校验，但没有消费方）。
  # 工具调用轮数由 agent.max_iterations 控制；保留它只为兼容既有配置。
  max_iterations: 10

  # 思考模式（DeepSeek）：默认开启，effort 默认 high。
  thinking: true
  reasoning_effort: low        # low / high / max

  # 模型单价（每百万 token 的美元价），用于台账的成本统计（F-85）。
  # 留空或全 0 = 不计成本，但 token 与请求数仍然照记——
  # "花了多少 token"与"花了多少钱"是两件事，前者不依赖价格表。
  # 价格要填**当时**的价：台账会记录 pricing_version，改价后老数据仍可解释。
  # 环境消息（群里**没被 @** 的）的压缩预算。
  # 为什么要单独一套：群里刷屏几分钟就能把真正的对话挤出窗口。
  # 环境是背景，受 token 预算约束；与机器人的对话才是主体，按 history_turns 保留。
  # 负数 = 不压缩。
  ambient_token_budget: 1200
  # 单条环境消息的字符上限；超出会截断并提示模型可用 recall_history 看完整内容。
  ambient_max_chars: 200

  # 模型单价（每百万 token 的美元价），用于台账的成本统计（F-85）。
  pricing:
    version: ""
    input_per_million: 0
    output_per_million: 0
    cache_hit_per_million: 0

  # 缓存优先：system_prompt(_file) 是整个会话的不可变前缀，启动时读一次就固定。
  # 逐字节不变才能命中前缀缓存；严禁写入时间戳/随机数等易变内容。
  #
  # 实测（deepseek-flash）：前缀 53~77 token 时命中率恒为 0%；约 1658 token 时，
  # 完全相同的第二次请求命中 84.9%，追加一轮后 91.9%。所以前缀越长收益越大，
  # 而这段前缀是所有会话共享的——只付一次未命中的钱。
  # 方式一：从文件读取（推荐长人格）。文件在启动时读一次并固定为不可变前缀。
  # system_prompt_file: prompts/my-persona.md
  # 方式二：直接内联；system_prompt_file 优先级更高。
  system_prompt: "你是一个运行在聊天平台上的助手。回答要简洁、口语化，适合在聊天窗口阅读。"
  # 最多回灌多少条历史（一轮约两条）；存储层用高水位批量裁剪，避免每轮裁剪破坏前缀
  history_turns: 20
  # F-32 上下文预算：默认关闭（不配置 max_context 时预算为 nil，请求字节不变）。
  # 开启后每次请求按「窗口 - 输出预留 - 工具预留」裁剪，超长历史不再被服务端拒绝；
  # system 消息标记为 Pinned，裁剪永远不会把它丢掉。
  max_context: 0             # 模型上下文窗口（token）；0 = 不启用预算
  reserve_output: 1024       # 留给输出的 token
  reserve_tools: 512         # 留给工具 schema 的 token（实际占用更大时按实际预留）

store:
  # 持久层（F-83，见 docs/adr/0003）。SQLite 单文件，启用 WAL、单写者串行化、
  # 抖动重试；打不开即**启动失败**，不静默降级为内存。
  path: ./data/agentbot.db
  # SQLite 忙等超时。刻意取短值：默认的长超时会让并发写者按同一节奏退避。
  busy_timeout: 1s

history:
  # 对话历史落盘的 JSONL 路径（复用 F-38 的存储实现）。
  # 留空则仅进程内，重启即丢——启动时会有 WARN 提醒。
  file: ./data/history.jsonl
  # **存储**保留的条数上限（默认 400），远大于呈现窗口（llm.history_turns）。
  # 两者分开是 recall_history 真正有用的前提：窗口外的历史仍在存储里，才召得回来。
  retention: 400

agent:
  # 开启后回复走 ReAct 循环（F-35），可调用工具；关闭则直连 LLM。
  enabled: true
  max_iterations: 10
  # 单个工具的执行超时。注意：F-45 的人工审批等待占用**独立预算**，不计入这里。
  step_timeout: 30s
  # native：只消费 provider 原生的 tool_calls；
  # auto：原生为主，模型把动作吐在文本里时用 F-39 的解析器抢救（见 ADR-0001）。
  protocol: auto
  # 注册 end_action / save_memory / noop 三个虚拟动作（F-40）。
  virtual_actions: true
  # 长期记忆。落盘用 JSONL（复用 F-38 的历史存储）；F-48 的完整实现（书签、
  # 向量召回、Forget/List）在 M3。
  memory: true
  # 每个作用域的条数上限（作用域即会话键，记忆严格按作用域隔离）。
  memory_max: 64
  # 落盘路径。留空则仅进程内，重启即丢——启动时会有一条 WARN 提醒。
  memory_file: ./data/memory.jsonl
  # 要注册的内置工具（F-44）；留空表示全部注册。
  # 可选：calculator / current_time / json_query / http_fetch /
  #       memory_save / memory_recall / recall_history
  tools: []
  # F-45 权限闸门。**默认关闭**：权限表是 fail-closed 的，
  # 没配好审批通道就打开会让所有未放行工具都被拒绝。
  approval_enabled: false
  # 启用审批时的放行表（工具 -> 角色）。角色：owner / admin / member / private。
  # allow:
  #   calculator: [member, private]
  #   current_time: [member, private]
  #   json_query: [member, private]
  approval_timeout: 60s

  # ---- 长期记忆的两条写入通道（相互独立，可任选其一或同时开启）----

  # 通道一：关键词规则触发。用户说"记住：xxx"时无条件写入。
  # 确定性、无额外 LLM 调用、每条写入都有日志可审计；但依赖用户明说"记住"。
  auto_memory:
    enabled: false
    # 留空使用内置触发词（记住：/ 帮我记住：/ 记一下：/ 别忘了： 等）
    triggers: []

  # 记忆写入的语义判官（F-87）。
  #
  # 字符相似度做不了语义判断：实测「旧的一条」与「新的一条」相似度正好 0.50，
  # 却是两件不同的事。所以写入决策是**混合**的：
  #   完全相同 / 相似度>=0.90 / 相似度<0.30 -> 确定性判定，不调用模型
  #   落在 0.30~0.90 的歧义带            -> 用**关闭思考**的模型问一次「是不是同一件事」
  # 判官结果按文本对缓存；同一对永不重复询问。
  # 判官不可用时退回确定性判据，写入照常成功——不因判官故障丢记忆。
  memory_judge:
    enabled: true

  # 工具使用提示：追加在系统提示词末尾，告诉模型它有哪些手段可用。
  # 目前主要提示「引用内容缺上下文时可用 recall_history 回溯前后文」。
  tool_hint:
    enabled: true
    instruction: ""   # 留空使用内置提示

  # ---- 空闲反思（F-48 的延伸）----
  # 对话**滑出上下文窗口**且该会话**安静下来**后，把那段内容交给模型提炼成长期记忆，
  # 避免"聊过但没记住"。**默认关闭**：它会在用户没说话时主动花钱。
  #
  # 省钱靠四道闸门（全部满足才调模型）+ 关闭思考的模型 + 压缩输入：
  #   1) 静默    ：距上次活动 > idle_after
  #   2) 有新内容：水位之后、且已滑出呈现窗口的条目 > 0
  #   3) 节流    ：同一会话距上次反思 > min_interval
  #   4) 预算    ：当日累计调用数 < daily_budget（硬上限，用尽即完全停止）
  # 输入还会先压缩：连续环境消息合并、单条截断、总条数封顶——
  # 按"发生了什么"付费，而不是按原文长度付费。
  reflect:
    enabled: false
    every: 1m                  # 扫描间隔（无可反思会话时，扫描本身不花钱）
    idle_after: 5m             # 静默多久算"这轮聊完了"
    min_interval: 30m          # 同一会话两次反思的最小间隔
    max_items: 40              # 单次送进模型的最大条目数
    max_facts: 5               # 单次最多写入的事实数
    daily_budget: 50           # 每日反思调用上限（花钱的硬闸门）
    timeout: 45s               # 单次反思总预算

  # 通道二：由模型自己判断（默认）。在系统提示词末尾追加一段指令，
  # 要求模型遇到值得长期记住的事实就主动调用 save_memory。
  # 这是**概率性**的：可能漏记也可能误记；好处是不依赖用户说"记住"。
  proactive_memory:
    enabled: true
    # 留空使用内置指令（agent.DefaultProactiveMemoryInstruction）
    instruction: ""

behavior:
  # 私聊策略：always / never
  private: always
  # 群聊策略：always / on_mention / never
  #   on_mention 是默认值——群里不 @ 机器人就不回复，避免刷屏
  group: on_mention

  # 回复里的空行会被拆成多条消息分别发送。聊天窗口里一大块文字读起来很累，
  # 真人是一条一条发的。段内的单个换行不会拆。
  split_on_blank_line: true
  # 连发之间的间隔
  split_delay: 400ms
  # 单次回复最多拆成几条；超出的尾部会合并进最后一条，避免刷屏
  max_segments: 4

# ---- 提示词模板（F-33）----
# 静态前缀（基础提示词 + 记忆指令 + 身份 + 工具提示）由模板引擎渲染，
# 顺序与分隔符在模板里而非代码里。dir 下的同名模板（如 system.tmpl）覆盖内置版本；
# 缺失则回退内置版本。模板在**启动期**校验：写错变量名、语法错误都会让启动失败。
# 渲染结果只随配置变化（不含时间/随机数），因为它是所有会话共享的缓存前缀（F-65）。
prompt:
  dir: prompts

# ---- 权限即提示词（F-53 / F-54）----
# 权限表同时用于两处：渲染进提示词的**半静态段**（按角色），以及在平台 API 出口
# 做硬拦截（角色不允许的 action 直接拒绝，不到达传输层）。
# file 是**覆盖**：文件不存在时使用内置默认表并记一条日志；文件存在但解析/校验失败
# 会让启动失败（权限表是安全边界，静默退回默认等于换了一套权限）。文件存在时热加载。
policy:
  file: actions.yaml

log:
  level: info
  format: json
  queue_size: 1024
  debug_content: false
  components:
    llm: debug

shutdown:
  timeout: 10s

# ---- 令牌桶限速（F-18）----
# 防止单用户/单群刷屏打爆 LLM 额度。默认**关闭**：限速会让超限事件被整条丢弃
# （连"只记录"的兜底路由也不执行），需要你确认这是想要的行为。
# 挂载为 mid 钩子；key 是用户与群，TTL = burst/rate*3 自动回收空闲 key。
# F-24：这几个参数**热加载**——改本文件后按新参数重建桶，不必重启（新参数从下一次请求生效）。
ratelimit:
  enabled: false
  user_per_minute: 20
  user_burst: 5
  group_per_minute: 120
  group_burst: 20

# ---- 功能开关（F-19）----
# 群管可以按群关闭某个插件（/switch <plugin> on|off），重启后保持。
# file 为空则仅进程内，重启即丢。
toggle:
  enabled: false
  default_on: true
  file: ./data/toggles.json

# ---- 审计日志（F-60）----
# 审计**不可关闭**（规格明确要求），只能调去处与内容保留量。
# 异步 + 有界队列：写失败或队列满只丢审计并计数，绝不影响主流程。
audit:
  file: ./data/audit.jsonl
  stdout: false
  queue_size: 4096
  # 用户内容只保留前 N 个字符（其余以 …(len=N) 代替），避免审计里留下大段聊天内容。
  content_limit: 20

# ---- 指标与探针（F-68 / F-69）----
# 独立监听地址，默认只绑回环：/metrics、/healthz、/readyz。
# readyz 会检查依赖（存储可用等），结果缓存 10s；healthz 只看进程存活。
ops:
  enabled: true
  addr: 127.0.0.1:9090
  # 非空时三个端点都要求 Authorization: Bearer <token>；绑定回环时通常不需要。
  auth_token: ""
  ready_cache_ttl: 10s
  probe_timeout: 1s

# ---- 单飞（反并发，F-17）----
# 同一用户连点两次时，第二次在入口被拒，避免触发两次昂贵调用。
# key: user（只看用户）或 user_group（用户+群，默认）。
singleflight:
  enabled: false
  key: user_group
  # 被拒绝时是否回一句"正在处理中"；默认关闭以免刷屏。
  notice: false

# ---- 密钥来源（F-61）----
# 优先级：api_key_env（环境变量）> api_key_file（密钥文件）> api_key（内联，不推荐）。
# 内联会在启动时告警；密钥文件在 Unix 下建议 0600，权限过宽只告警不阻断。
# 例：
#   llm:
#     api_key_env: DEEPSEEK_API_KEY
#     api_key_file: /etc/agentbot/deepseek.key

# ---- 入站内容审查与黑名单（F-57 / F-58）----
# 默认关闭。开启后：命中敏感词按 action 脱敏或拦截；被拉黑的用户/群不进入后续处理；
# 防刷在窗口内超过阈值即临时封禁。拦截会写审计与 guard_blocks 指标。
moderation:
  enabled: false
  sensitive_words: []
  # 每行一个词，忽略空行与 # 注释。
  sensitive_words_file: ""
  action: mask            # mask（脱敏放行）| block（拦截）
  mask_replacement: "***"
  # 封禁记录落盘路径；留空则仅进程内（重启即丢）。
  blacklist_file: ./data/blacklist.json
  # 注意：超管**不再**配置在这里。moderation.super_users 已移除，
  # 请改用下面的 access.roles.superuser（出现旧键会让启动失败并给出迁移指引）。
  antispam:
    window: 10s
    max_messages: 20
    ban_duration: 60s
    duplicate_repeat: 5


# ---- 空闲反思（F-48 的延伸）----
# 当一段对话**滑出上下文窗口**、且该会话**安静下来**后，把那段内容交给模型提炼成长期记忆，
# 避免"聊过但没记住"。**默认关闭**：它会在用户没说话时主动花钱。
#
# 省钱靠四道闸门（全部满足才会调模型），以及"关闭思考的模型 + 压缩后的输入"：
#   1) 静默：距上次活动 > idle_after
#   2) 有新内容：水位之后、且已滑出呈现窗口的条目 > 0
#   3) 节流：同一会话距上次反思 > min_interval
#   4) 预算：当日累计调用数 < daily_budget（硬上限，用尽即完全停止）
# 输入还会先压缩：连续环境消息合并、单条截断、总条数封顶——按"发生了什么"付费，
# 而不是按原文长度付费。配置写在 agent 分节里：
#
#   agent:
#     reflect:
#       enabled: false
#       every: 1m              # 扫描间隔（无可反思会话时，扫描本身不花钱）
#       idle_after: 5m         # 静默多久算"这轮聊完了"
#       min_interval: 30m      # 同一会话两次反思的最小间隔
#       max_items: 40          # 单次送进模型的最大条目数
#       max_facts: 5           # 单次最多写入的事实数
#       daily_budget: 50       # 每日反思调用上限（花钱的硬闸门）
#       timeout: 45s           # 单次反思总预算

# ---- 名单与角色（按 QQ 号 / 群号）----
# 与 moderation 的黑名单不同：这里是**路由层直接丢弃**——名单外的消息不进入路由匹配、
# 不建会话、不落库、不产生任何模型调用（连"只记录"的兜底路由也不执行）。
# 代价是它只看得到 QQ 号与群号，看不到内容。
access:
  enabled: false
  # allow = 白名单（只有名单内处理）；deny = 黑名单（名单内丢弃）。
  # 启用时必须显式写，不写会让启动失败（防止"以为开了其实没开"）。
  mode: allow
  # QQ 号列表。
  users: []
  # 群号列表。
  groups: []
  # 用户名单是否也在群里生效（默认 true）：
  #   allow + true  → 群与人都要在名单里（只服务指定群里的指定人）
  #   allow + false → 群在名单即放行整群，或人在名单即放行（跨群私聊式白名单）
  #   deny  + true  → 群里的这些用户也会被丢弃
  #   deny  + false → 用户名单只对私聊生效
  check_users_in_group: true
  # 超管是否绕过名单（默认 true）。默认绕过是为了避免"配错白名单把自己锁在门外"——
  # 那种情况只能改文件重启才能恢复。关掉它需要至少配一个超管（否则启动失败）。
  bypass_super_users: true
  # 是否逐条记录被丢弃的消息（默认 false）。无论开关，丢弃都会进审计与 events_dropped 指标。
  log_drops: false
  # 用 QQ 号直接指定角色（**超管的唯一位置**），优先于平台上报的群成员角色：
  #   superuser —— 管理命令授权、policy 的 superuser 角色、永不封禁、绕过名单
  #   owner / admin / member —— policy 的角色（决定模型能用哪些 action）；
  #                              owner/admin 还能用 /switch
  # 同一个 QQ 写在多个角色里时按权限取高（不会因为书写顺序变权限）。
  roles:
    superuser: []      # 例：[10001]
    owner: []
    admin: []
    member: []

# ---- 人格定义目录（F-82）----
# 每个 <name>.yml 定义一个人格；name 必须与文件名一致。
# 留空时默认取 prompt.dir 下的 personas 子目录（即 prompts/personas）。
#   prompt:
#     dir: prompts
#     personas_dir: prompts/personas

# ---- 工具执行沙箱（F-46）----
# 默认关闭。开启后按白名单限制工具的读写路径、环境变量与联网能力，
# 并限制单次输出大小；越权调用返回结构化拒绝而不是执行。
sandbox:
  enabled: false
  max_output_bytes: 65536
  read_roots: []
  write_roots: []
  env_allowlist: []
  forbidden_ops: []
  forbidden_tools: []
  network_tools: []
  allow_network: false
  require_read_only: false

# ---- 成本统计与配额（F-66）----
# 默认关闭。开启后按模型单价统计 token 与费用，并按配额给出软限告警/硬限决策。
# 会话/用户维度已生效（归属经 ctx 进入 LLM 调用链），配额在调用前判定。
# 注意：downgrade 动作尚未强制（按请求切模型需要协议层支持），会告警并继续用原模型。
cost:
  enabled: false
  unknown_model: warn_zero     # warn_zero（0 计费并告警）| reject
  queue_size: 256
  prices: {}
  quotas: []

# ---- 语义缓存（F-63）----
# 默认关闭：它改变"同一句话在不同时刻得到什么回答"，省下的只是重复问题的 token。
# 命中条件 = 问题向量相似度 >= threshold 且 上下文指纹（人格/系统提示词）一致。
# 缓存前会过一遍出口过滤链（F-55）；带工具调用的轮次不进缓存。
semcache:
  enabled: false
  threshold: 0.95            # 命中所需最低相似度 (0,1]
  ttl_seconds: 3600
  max_entries: 4096
  skip_words: []             # 在内置跳过列表（时间/天气等）之外追加的易变话题关键词
  skip_patterns: []          # 附加正则；语法错误会让启动失败

# ---- 流式增量发送（F-64）----
# 默认关闭。只在"直连模型"路径生效（agent.enabled=false）：ReAct 每轮都在等完整的
# 工具调用结果，边流边发会让用户先看到半截文本。增量仍走统一出口与过滤链。
stream:
  enabled: false
  max_chars: 40              # 缓冲达到该长度即发送
  max_interval: 800ms        # 距上次发送超过该时长即发送
  min_interval: 800ms        # 发送频率上限，超限合并到下次
  first_min_chars: 8         # 首段最小长度，避免先抛半个字
  edit_messages: false       # 平台支持编辑消息时才开；否则改写会中止该流
  typing_hint: ""            # 非空时首段前单发一条提示，如"正在输入…"

# ---- 混合检索（F-51）----
# 默认关闭。开启后 recall_history 改用"BM25 关键词 + 二值向量 + RRF 融合"召回，
# 专有名词（关键词路）与改写表达（向量路）都能命中；两路必须对同一份条目排名。
# 负权重表示关闭该路（单路失败也会自动降级，不整体失败）。
retrieval:
  enabled: false
  keyword_weight: 1.0
  vector_weight: 1.0
  top_k: 5                   # 默认返回条数；工具给出的 limit 优先
  candidate_k: 20            # 每路候选数
  # 摘要树（F-52）：独立于关键词/向量的第三条召回源，在摘要层检索，
  # 宏观问题因此能命中上层摘要。摘要用确定性拼接（不调模型），聚类用二值哈希向量；
  # 树按会话缓存，条目数变化时重建。
  tree:
    enabled: false
    max_levels: 3
    min_cluster: 2           # 小于 2 会退化成单链，配置侧会回填
    branching: 4
    max_nodes: 10000
    cluster_threshold: 0.5


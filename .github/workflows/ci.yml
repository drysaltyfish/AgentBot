# 见 FEATURES.md F-78。Go 版本必须与 go.mod 一致（1.27.1）。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  # 必须选用"构建时 Go 版本 >= go.mod 目标版本"的 release，否则 golangci-lint 直接拒绝运行。
  # v2.14.0 由 go1.27.0 构建，可覆盖 go.mod 的 1.27.1。
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  build-test:
    name: build / vet / lint / test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 断言 go.mod 与 CI 的 Go 版本一致
        run: |
          set -euo pipefail
          mod_version="$(go mod edit -json | python3 -c 'import json,sys;print(json.load(sys.stdin)["Go"])')"
          if [ "$mod_version" != "$GO_VERSION" ]; then
            echo "go.mod 声明 $mod_version，CI 使用 $GO_VERSION" >&2
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          "$(go env GOPATH)/bin/golangci-lint" run
      - run: go test -race ./...

  golden-cross-platform:
    name: golden (linux + windows)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./... -run Golden
      - name: 断言 -update 在 CI 中被拒绝
        shell: bash
        run: |
          set -euo pipefail
          # 这条守卫的意图（F-74）：CI 里绝不允许用 -update 重写 golden 文件。
          #
          # 历史教训：上一版写成 `go test ... -update | grep -q "CI"` 而后失败——
          # 一是判据反了（输出里出现 CI 反而判为失败），二是当时根本没有 golden 用例，
          # -update 只是"未知 flag"报错，于是这一步无论对错都会通过，成了假安全感。
          # 现在改成：先探测哪些包真的有 golden 用例；有则真断言，没有则显式告知。
          #
          # 探测方式：以**已提交的 golden 文件**为准。
          #
          # 为什么不用 go test -list：实测同一份提交，windows 探测到了 internal/testutil，
          # ubuntu 却走了"未落地"分支——探测本身在平台间不稳定（它依赖测试二进制能否
          # 成功构建并列出用例）。golden 文件按 F-74 必须入库，用它探测是确定性的。
          #
          # 两个仍然成立的历史坑：
          #   1) -list 不受 -run 约束：`-run Golden -list '.*'` 会把全部用例都列出来，
          #      于是"探测"永远为真——这也是改用文件探测的原因之一。
          #   2) 不能对 ./... 断言：没有 -update flag 的包会先以"未知 flag"失败，
          #      掩盖"是助手接受了 -update"这个真正要报的原因。只对 golden 包断言。
          pkgs=""
          for p in $(go list ./...); do
            dir=$(go list -f '{{.Dir}}' "$p")
            if find "$dir" -name '*.golden' -print -quit 2>/dev/null | grep -q .; then
              pkgs="$pkgs $p"
            fi
          done
          pkgs=$(echo "$pkgs" | xargs)
          echo "含 golden 用例的包：$pkgs"

          if out=$(go test $pkgs -run Golden -update 2>&1); then
            echo "::error::-update 在 CI 中被接受了，golden 文件可能被意外重写"
            printf '%s\n' "$out"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'CI'; then
            echo "::error::-update 虽被拒绝，但原因不是预期的 CI 保护（输出中未出现 CI）"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "OK：-update 在 CI 中被拒绝（覆盖包：$pkgs）"

  bench-coverage:
    name: bench smoke + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -run=XXX -bench=. -benchtime=1x ./...
      - name: coverage
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "coverage: $total%"
          awk -v c="$total" 'BEGIN { if (c+0 < 60) { print "coverage below 60%" > "/dev/stderr"; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
